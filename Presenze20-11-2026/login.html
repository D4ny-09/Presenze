<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Accesso • Registro Presenze Oratorio & Catechismo</title>

  <!-- PWA & Mobile Web App Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oratorio">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Icone FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f1f5f9 55%, #e0e7ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: #ffffff;
      padding: 26px 24px 22px;
      text-align: center;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: #c7d2fe;
      margin-top: 4px;
    }

    .login-body {
      padding: 24px;
    }

    .login-field-label {
      font-weight: 700;
      color: #334155;
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: block;
    }

    .login-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 14px;
      align-items: center;
      gap: 8px;
    }

    .login-error.visible {
      display: flex;
    }

    .password-wrap {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      font-size: 0.95rem;
    }

    .btn-login-submit {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 8px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <header class="login-header">
      <div class="login-logo">
        <i class="fa-solid fa-church"></i>
      </div>
      <h1 class="login-title">Registro Presenze</h1>
      <p class="login-subtitle">Parrocchia • Oratorio &amp; Catechismo</p>
    </header>

    <div class="login-body">
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="loginUsername" class="login-field-label">
            <i class="fa-solid fa-user" style="color: #4f46e5; margin-right: 4px;"></i> Nome Utente
          </label>
          <input
            type="text"
            id="loginUsername"
            class="form-input"
            required
            autocomplete="username"
            autocapitalize="none"
            placeholder="Inserisci nome utente"
            autofocus
          >
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="loginPassword" class="login-field-label">
            <i class="fa-solid fa-lock" style="color: #4f46e5; margin-right: 4px;"></i> Password
          </label>
          <div class="password-wrap">
            <input
              type="password"
              id="loginPassword"
              class="form-input"
              required
              autocomplete="current-password"
              placeholder="Inserisci la password..."
              style="padding-right: 40px;"
            >
            <button type="button" id="togglePasswordBtn" class="password-toggle" title="Mostra/nascondi password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="loginErrorBox" class="login-error">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span id="loginErrorText">Nome utente o password non corretti.</span>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-primary btn-login-submit">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Accedi</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const usernameInput = document.getElementById('loginUsername');
      const passwordInput = document.getElementById('loginPassword');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const errorBox = document.getElementById('loginErrorBox');
      const errorText = document.getElementById('loginErrorText');
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('btnLoginSubmit');

      [usernameInput, passwordInput].forEach((el) => {
        if (el) {
          el.addEventListener('input', () => errorBox.classList.remove('visible'));
        }
      });

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const isPwd = passwordInput.type === 'password';
          passwordInput.type = isPwd ? 'text' : 'password';
          toggleBtn.innerHTML = isPwd
            ? '<i class="fa-solid fa-eye-slash"></i>'
            : '<i class="fa-solid fa-eye"></i>';
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorBox.classList.remove('visible');

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Accesso in corso...</span>';
          }

          const res = await window.loginWithUsername(usernameInput.value, passwordInput.value);
          if (res.ok) {
            window.location.replace(res.homePage);
          } else {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Accedi</span>';
            }
            errorText.textContent = res.error || 'Nome utente o password non validi.';
            errorBox.classList.add('visible');
            passwordInput.select();
          }
        });
      }
    });
  </script>
</body>
</html>
